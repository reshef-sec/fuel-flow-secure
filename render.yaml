# Render Blueprint — one Node web service: Express API + the built React SPA.
services:
  - type: web
    name: fuel-flow-secure
    runtime: node
    branch: DELEK
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # mongodb+srv://USER:PASS@cluster.xxxx.mongodb.net/reshef?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_TOOLS_OWNER_EMAIL
        sync: false # the owner's sign-in email: only this admin sees the owner-only tools
      - key: MICROSOFT_CLIENT_ID
        sync: false # Azure app registration → Application (client) ID
      - key: MICROSOFT_CLIENT_SECRET
        sync: false # Azure app registration → Certificates & secrets
      - key: GOOGLE_CLIENT_ID
        sync: false # Google Cloud → Credentials → OAuth client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # from the same OAuth client
      - key: TWILIO_ACCOUNT_SID
        sync: false # SMS to employees; until set, the issuer sees the code on screen
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false # sender number or approved sender name
      - key: MICROSOFT_TENANT_ID
        sync: false # your organisation's tenant id; leave empty to also allow personal Outlook accounts
